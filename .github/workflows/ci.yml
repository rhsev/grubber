name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.27 is the declared minimum: encoding/json/v2 needs it.
        # "stable" covers the toolchain the release binaries are built with,
        # where encoding/json runs on the json/v2 backend.
        go: ["1.27", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
